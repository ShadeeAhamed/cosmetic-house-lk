services:
  - type: web
    name: cosmetic-house-whatsapp-bot
    env: node
    plan: starter
    buildCommand: ""
    startCommand: npm run start:whatsapp
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      - key: BUSINESS_NAME
        value: Cosmetic House
      - key: BOT_NAME
        value: Sophia
      - key: SITE_ORIGIN
        value: https://cosmetichouse.com.lk
      - key: GITHUB_PAGES_ORIGIN
        value: https://shadeeahamed.github.io
      - key: ADMIN_ORIGIN
        value: https://cosmetichouse.com.lk
      - key: PAYMENT_PUBLIC_URL
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: PAYHERE_MODE
        value: sandbox
      - key: PAYHERE_MERCHANT_ID
        sync: false
      - key: PAYHERE_MERCHANT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        sync: false

  - type: web
    name: cosmetic-house-social-bot
    env: node
    plan: starter
    buildCommand: ""
    startCommand: npm run start:social
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SOCIAL_BOT_PORT
        value: 10000
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: BUSINESS_NAME
        value: Cosmetic House
      - key: BOT_NAME
        value: Sophia
