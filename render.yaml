services:
  - type: web
    name: cosmetic-house-whatsapp-bot
    env: node
    plan: starter
    buildCommand: ""
    startCommand: npm run start:whatsapp
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      - key: BUSINESS_NAME
        value: Cosmetic House
      - key: BOT_NAME
        value: Sophia

  - type: web
    name: cosmetic-house-social-bot
    env: node
    plan: starter
    buildCommand: ""
    startCommand: npm run start:social
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SOCIAL_BOT_PORT
        value: 10000
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: BUSINESS_NAME
        value: Cosmetic House
      - key: BOT_NAME
        value: Sophia
