<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order | Cosmetic House.lk</title>
  <meta name="description" content="Track Cosmetic House.lk beauty orders and delivery progress in Sri Lanka." />
  <link rel="stylesheet" href="styles.css?v=20260521-image-profile-fix" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html#top"><img src="cosmetic-house-logo.jpeg" alt="Cosmetic House logo" /><span><strong>Cosmetic House.lk</strong><small>Premium beauty destination</small></span></a>
    <nav class="main-nav"><a href="index.html#shop">Shop</a><a href="faq.html">FAQ</a><a href="contact.html">Support</a></nav>
  </header>
  <main class="policy-page">
    <section class="policy-hero">
      <p class="eyebrow">Order Care</p>
      <h1>Track your beauty order</h1>
      <p>Use your order ID or WhatsApp number to check the latest order stage. For fastest help, message us directly.</p>
    </section>
    <section class="policy-content page-grid">
      <form class="premium-form track-panel">
        <label>Order ID<input type="text" placeholder="CH-2026-0001" /></label>
        <label>WhatsApp number<input type="tel" placeholder="+94 7X XXX XXXX" /></label>
        <button class="button primary" type="button">Check status</button>
      </form>
      <div class="track-panel">
        <strong>Order stages</strong>
        <div class="status-steps"><span>New order</span><span>Confirmed</span><span>Packed</span><span>Dispatched</span><span>Delivered</span></div>
      </div>
    </section>
  </main>
</body>
</html>
